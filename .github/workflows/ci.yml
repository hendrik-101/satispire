name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planner:
    name: planner checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:discovery
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:web
      - run: npm run smoke
      - run: npm run plan -- --demo
      - run: node scripts/write-build-info.mjs
        env:
          APP_REVISION: ${{ github.sha }}
      - run: npm run test:runtime
      - run: npm run test:browser:runtime
      - run: npm run test:container
        env:
          APP_REVISION: ${{ github.sha }}
          SATISPIRE_ARTIFACT_DIR: release-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: runtime_artifact
        with:
          name: satispire-runtime-${{ github.event_name }}-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record runtime artifact identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTIFACT_URL: ${{ steps.runtime_artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.runtime_artifact.outputs.artifact-digest }}
        run: |
          node -e 'const fs = require("node:fs"); const m = JSON.parse(fs.readFileSync("release-artifact/manifest.json")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify({artifactUrl: process.env.ARTIFACT_URL, artifactDigest: process.env.ARTIFACT_DIGEST, ...m}, null, 2));'
